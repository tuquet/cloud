name: CI (Supabase DB Tests & Lint)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Supabase Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase Local Engine
        run: supabase start

      - name: Install All Plugins
        run: bash scripts/plugins/apply_plugins.sh local all install true

      - name: Lint Database Migrations
        run: supabase db lint

      - name: Run Database Tests
        run: bash scripts/test_db.sh local

  notify:
    name: Notify Telegram
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_RESULTS: "${{ join(needs.*.result, ' ') }}"
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram credentials not found, skipping notification."
            exit 0
          fi

          if echo "$JOB_RESULTS" | grep -q "failure"; then
            ICON="❌"
            STATUS_TEXT="FAILED"
          elif echo "$JOB_RESULTS" | grep -q "cancelled"; then
            ICON="⚠️"
            STATUS_TEXT="CANCELLED"
          else
            ICON="✅"
            STATUS_TEXT="SUCCESS"
          fi

          RAW_COMMIT="${{ github.event.head_commit.message }}"
          COMMIT_MSG=$(echo "$RAW_COMMIT" | head -n 1 | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          if [ -z "$COMMIT_MSG" ]; then
            COMMIT_MSG="Triggered by ${{ github.event_name }}"
          fi

          TEXT="${ICON} <b>GitHub Actions: ${STATUS_TEXT}</b>

📦 <b>Repo:</b> <a href=\"${{ github.server_url }}/${{ github.repository }}\">${{ github.repository }}</a>
⚙️ <b>Workflow:</b> ${{ github.workflow }}
🌿 <b>Branch:</b> <code>${{ github.ref_name }}</code>
👤 <b>Author:</b> ${{ github.actor }}
💬 <b>Commit:</b> ${COMMIT_MSG}
🔗 <a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">View Run Details</a>"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" > /dev/null || true
