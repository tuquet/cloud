name: Deploy Database to Supabase Cloud

on:
  push:
    tags:
      - 'uat-v[0-9]+.[0-9]+.[0-9]+*'       # UAT / Staging tag (Enables reset & re-seed)
      - 'v[0-9]+.[0-9]+.[0-9]+*'           # Production tag (Safe incremental migration only)
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'uat'
        type: choice
        options:
          - 'uat'
          - 'production'
      action:
        description: 'Deployment action to perform'
        required: true
        default: 'push_migrations'
        type: choice
        options:
          - 'reset_and_deploy'
          - 'push_migrations'
          - 'full_deploy'
          - 'apply_plugins'
          - 'dry_run'
      project_ref:
        description: 'Optional custom Supabase project ref override'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy (${{ github.ref_name || inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Target Environment & Security Guardrails
        run: |
          set -e
          REF_NAME="${{ github.ref_name }}"
          INPUT_ENV="${{ inputs.environment }}"
          INPUT_ACTION="${{ inputs.action }}"

          if [[ "$REF_NAME" == uat-* ]] || [[ "$INPUT_ENV" == "uat" ]]; then
            echo "ENV_NAME=uat" >> $GITHUB_ENV
            TARGET_REF="${{ inputs.project_ref || secrets.SUPABASE_UAT_PROJECT_ID || 'dswhacsoaxgpfnkaxnhz' }}"
            TARGET_PASS="${{ secrets.SUPABASE_UAT_DB_PASSWORD || secrets.SUPABASE_DB_PASSWORD }}"
            DEFAULT_ACT="reset_and_deploy"
          else
            echo "ENV_NAME=production" >> $GITHUB_ENV
            TARGET_REF="${{ inputs.project_ref || secrets.SUPABASE_PROD_PROJECT_ID || secrets.SUPABASE_PROJECT_ID }}"
            TARGET_PASS="${{ secrets.SUPABASE_PROD_DB_PASSWORD || secrets.SUPABASE_DB_PASSWORD }}"
            DEFAULT_ACT="push_migrations"
          fi

          CHOSEN_ACTION="${INPUT_ACTION:-$DEFAULT_ACT}"

          # CRITICAL SAFETY GUARDRAIL: Never allow reset_and_deploy in production!
          if [[ "$REF_NAME" == v* || "$INPUT_ENV" == "production" ]] && [[ "$CHOSEN_ACTION" == "reset_and_deploy" ]]; then
            echo "[-] CRITICAL SECURITY GUARDRAIL: 'reset_and_deploy' is strictly forbidden in Production!" >&2
            exit 1
          fi

          echo "PROJECT_REF=$TARGET_REF" >> $GITHUB_ENV
          echo "SUPABASE_DB_PASSWORD=$TARGET_PASS" >> $GITHUB_ENV
          echo "DEPLOY_ACTION=$CHOSEN_ACTION" >> $GITHUB_ENV
          echo "SUPABASE_ACCESS_TOKEN=${{ secrets.SUPABASE_ACCESS_TOKEN }}" >> $GITHUB_ENV

          echo "==> Target Environment: $INPUT_ENV (ref: $REF_NAME)"
          echo "==> Target Project Ref: $TARGET_REF"
          echo "==> Target Action: $CHOSEN_ACTION"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.119.0

      - name: Link Supabase Project
        run: |
          echo "Linking to Supabase project $PROJECT_REF..."
          if [ -n "$SUPABASE_DB_PASSWORD" ]; then
            supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          else
            supabase link --project-ref "$PROJECT_REF"
          fi

      - name: Execute Deployment
        run: |
          set -e
          echo "Executing deployment action: $DEPLOY_ACTION on environment: $ENV_NAME"

          echo "==> Ensuring remote migration history is synchronized..."
          if [ -n "$SUPABASE_DB_PASSWORD" ]; then
            supabase migration repair --linked --status reverted 20261009000001 --password "$SUPABASE_DB_PASSWORD" || true
            supabase migration repair --linked --status applied 20261013000001 --password "$SUPABASE_DB_PASSWORD" || true
          else
            supabase migration repair --linked --status reverted 20261009000001 || true
            supabase migration repair --linked --status applied 20261013000001 || true
          fi

          case "$DEPLOY_ACTION" in
            "reset_and_deploy")
              echo "==> Step 0: Resetting remote linked database to pristine state..."
              if [ -n "$SUPABASE_DB_PASSWORD" ]; then
                supabase db reset --linked --yes --password "$SUPABASE_DB_PASSWORD"
              else
                supabase db reset --linked --yes
              fi
              echo "==> Step 1: Applying business plugins & seed data..."
              bash scripts/plugins/apply_plugins.sh linked all install true
              ;;
            "push_migrations")
              echo "==> Pushing migrations to linked project..."
              if [ -n "$SUPABASE_DB_PASSWORD" ]; then
                supabase db push --linked --include-all --password "$SUPABASE_DB_PASSWORD"
              else
                supabase db push --linked --include-all
              fi
              ;;
            "dry_run")
              echo "==> Running migration dry run..."
              if [ -n "$SUPABASE_DB_PASSWORD" ]; then
                supabase db push --linked --dry-run --password "$SUPABASE_DB_PASSWORD"
              else
                supabase db push --linked --dry-run
              fi
              ;;
            "apply_plugins")
              echo "==> Applying all business plugins..."
              bash scripts/plugins/apply_plugins.sh linked all install true
              ;;
            "full_deploy")
              echo "==> Step 1: Pushing database migrations..."
              if [ -n "$SUPABASE_DB_PASSWORD" ]; then
                supabase db push --linked --include-all --password "$SUPABASE_DB_PASSWORD"
              else
                supabase db push --linked --include-all
              fi
              echo "==> Step 2: Applying business plugins & seed data..."
              bash scripts/plugins/apply_plugins.sh linked all install true
              ;;
            *)
              echo "Unknown action: $DEPLOY_ACTION"
              exit 1
              ;;
          esac

      - name: Reload PostgREST Schema Cache
        if: success()
        run: |
          echo "==> Reloading PostgREST Schema Cache..."
          supabase db query --linked "NOTIFY pgrst, 'reload schema';" || true

      - name: Verify Migration State
        if: always()
        run: |
          echo "==> Checking migration status..."
          if [ -n "$SUPABASE_DB_PASSWORD" ]; then
            supabase migration list --linked --password "$SUPABASE_DB_PASSWORD" || true
          else
            supabase migration list --linked || true
          fi

      - name: Generate TypeScript Definitions
        if: success()
        run: |
          mkdir -p types
          echo "==> Generating TypeScript definitions from Supabase Cloud..."
          supabase gen types typescript --linked --schema public,workers,automation,billing,events,media > types/database.types.ts
          echo "==> Generated $(wc -l < types/database.types.ts) lines of TypeScript definitions."

      - name: Upload TypeScript Types Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-database-types
          path: types/database.types.ts
          retention-days: 30

      - name: Commit Generated Types
        if: success()
        run: |
          git config user.name "bot[bot]"
          git config user.email "bot@tuquet.dev"
          if [[ -n $(git status --porcelain types/database.types.ts) ]]; then
            git add types/database.types.ts
            git commit -m "chore(types): auto-generate database.types.ts from cloud schema [skip ci]"
            git push origin HEAD:${{ github.ref_name }} || true
            echo "Generated types committed."
          else
            echo "No changes in database types."
          fi

      - name: Post-Deployment Smoke Test
        if: success()
        run: |
          echo "==> Running Cloud Gateway Smoke Test..."
          node scripts/testing/smoke_test_cloud.mjs
